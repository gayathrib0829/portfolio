    <style>
      /* Simple initial loading styling to make app feel super premium even on slow loads */
      body {
        margin: 0;
        background: #080b11;
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: #f8fafc;
        overflow-x: hidden;
      }
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #080b11;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out, visibility 0.5s;
      }
      .loader {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(0, 242, 254, 0.1);
        border-radius: 50%;
        border-top-color: #00f2fe;
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-5se6qv40.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D_uh_S4L.css">
  </head>
  <body>
    <div id="root">
      <div class="loading-screen" id="app-loading-screen">
        <div class="loader"></div>
        <p style="margin-top: 20px; font-weight: 500; font-family: 'Outfit', sans-serif; letter-spacing: 2px; color: #00f2fe; text-transform: uppercase;">Loading Portfolio</p>
      </div>
    </div>
    <script>
      // Remove load screen after React takes over
      window.addEventListener('DOMContentLoaded', () => {
        const loader = document.getElementById('app-loading-screen');
        if (loader) {
          setTimeout(() => {
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
          }, 300);
        }
      });
    </script>
  </body>
